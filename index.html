<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Webcam Sempre Ativa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
        }
        #container {
            margin-top: 20px;
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        video {
            display: block;
            transform: scaleX(-1); /* Efeito espelho (opcional, mais natural) */
        }
        .status {
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>
    
    <div id="container">
        <!-- O atributo autoplay inicia sozinho, e playsinline melhora suporte mobile -->
        <video id="videoElement" width="640" height="480" autoplay playsinline></video>
    </div>


    <script>
        const video = document.getElementById('videoElement');
        const statusText = document.getElementById('statusText');

        // Configurações de restrição (pode forçar alta resolução se desejar)
        const constraints = {
            video: {
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: "user" // Câmera frontal/webcam padrão
            },
            audio: false // Mantenha false para não dar microfonia
        };

        // Função para ligar e manter a câmera ativa
        function iniciarCamera() {
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    // Vincula o fluxo de vídeo diretamente ao elemento HTML
                    video.srcObject = stream;
                    statusText.innerText = "Câmera conectada e ativa por tempo indeterminado.";
                })
                .catch(function(error) {
                    console.error("Erro ao acessar a webcam: ", error);
                    statusText.style.color = "red";
                    statusText.innerText = "Erro: Permissão negada ou câmera não encontrada.";
                });
        }

        // Executa assim que a página carrega
        window.addEventListener("DOMContentLoaded", iniciarCamera);
    </script>
</body>
</html>
